services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: root_daemon
      POSTGRES_PASSWORD: justdoit
      POSTGRES_DB: event_management
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root_daemon -d event_management']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: docker.io/rootdaemon/event-management-api:latest
    platform: linux/amd64
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: root_daemon
      DATABASE_PASSWORD: justdoit
      DATABASE_NAME: event_management
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
    restart: unless-stopped

volumes:
  pgdata:
